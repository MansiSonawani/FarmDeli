name: resumebanao

on:
  push:
    paths: ['resumebanao/**', '.github/workflows/resumebanao.yml']
  pull_request:
    paths: ['resumebanao/**', '.github/workflows/resumebanao.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resumebanao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: resumebanao/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
